<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gestión del timbre escolar - Schedule</title>

    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/bootstrap.bundle.min.js"></script>

    <script src="./js/bootstrap.min.js"></script>
    <script src="/SchoolBellExamen2/js/main.js"></script>
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🔔 SchoolBell System</span>

        <button class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#modalCalendario">
            + Añadir calendario
        </button>
    </div>
</nav>


<!-- CONTENIDO -->
<div class="container">
    
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">Programar Timbre (Time)</div>
                <div class="card-body">
                    <form id="timeForm" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label ">Nombre Momento</label>
                            <input type="text" id="timeName" class="form-control" placeholder="Ej: Patio" pattern="[A-Za-zÀ-ÿ\s]{2,14}" required >
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Hora</label>
                            <input type="time" id="timeHour" class="form-control" min="0" max="24" step="1" required >
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Segs</label>
                            <input type="number" id="timeDuration" class="form-control "min="100" max="300" step="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Canción</label>
                            <select id="timeSongSelect" class="form-select" >
                                </select>
                        </div>
                        <div class="col-12">
                            <p id="missatgeError"></p>
                            <button type="submit" class="btn btn-dark flex-sm-fill" id="filtrar">Assignar horario Actual</button>
                        </div>
                    </form>
                </div>
            </div>
        <table  class="table table-striped">
            <thead>
                <th>id</th>
                <th>Nombre</th>
                <th>Hora</th>
                <th>Segs</th>
                <th>Cancion</th>
                <th>Accions</th>
            </thead>
            <tbody id="listado"> </tbody>

        </table>
</div>

<div class="modal fade"
     id="modalCalendario"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-secondary text-white">

                <h5 class="modal-title">
                    Calendari
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form>

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del calendario
                        </label>
                        <input type="hidden" id="scheduleId">
                        <input type="text"
                               class="form-control"
                               id="nameSchedule"
                               placeholder="Ej: Horario Estandard"
                               >
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100"
                            id="scheduleSaveBtn">
                        Guardar calendario
                    </button>

                     <p id="missatgeError" class="text-danger"></p>
                </form>

            </div>

        </div>

    </div>

</div>


</body>
</html>
